services:
  postgres:
    image: postgres:16-alpine
    container_name: account-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-account_db}
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-1234}
    ports:
      - "5432:5432"
    volumes:
      - account-data:/var/lib/postgresql/data
    networks:
      - account-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-account_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:8
    container_name: account-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
    ports:
      - "8088:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - account-network

  axon-server:
    image: axoniq/axonserver:2024.2.3
    container_name: account-axon-server
    hostname: axon-server
    environment:
      AXONIQ_AXONSERVER_STANDALONE: "true"
    ports:
      - "8024:8024"
      - "8124:8124"
    volumes:
      - axon-data:/axonserver/data
      - axon-events:/axonserver/events
    networks:
      - account-network

volumes:
  account-data:
  axon-data:
  axon-events:

networks:
  account-network:
    name: account-network
